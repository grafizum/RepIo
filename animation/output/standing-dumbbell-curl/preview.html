<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standing Dumbbell Curl — test</title>
<style>
  :root { --bg: #0b0f1c; --fg: #e8eaf0; --muted: #8b93a7; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  figure { margin: 0; border-radius: 14px; overflow: hidden; }
  figure video, figure img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; }
  figcaption { padding: 8px 12px; font-size: 13px; color: var(--muted); background: #1e1e1e; }
  .navy { background: #121212; } .light { background: #f2f3f5; } .dark { background: #000; }
  h2 { font-size: 16px; margin: 32px 0 12px; }
  .wide img { aspect-ratio: auto; }
</style>
</head>
<body>
<main>
  <h1>Standing Dumbbell Curl</h1>
  <p>Sandstone mannequin. Transparent loop (render.webm) on three backgrounds, then the head close-ups.</p>
  <div class="grid">
    <figure class="navy"><video src="render.webm" autoplay loop muted playsinline></video><figcaption>RepIo dark</figcaption></figure>
    <figure class="light"><video src="render.webm" autoplay loop muted playsinline></video><figcaption>Light theme</figcaption></figure>
    <figure class="dark"><video src="render.webm" autoplay loop muted playsinline></video><figcaption>Black</figcaption></figure>
  </div>
  <h2>Head</h2>
  <figure class="wide navy"><img src="../character/head.png" alt="Mannequin head: three-quarter, front and side"><figcaption>Three-quarter, front and side</figcaption></figure>
  <h2>Contact sheet</h2>
  <figure class="wide navy"><img src="contact-sheet.png" alt="12 frames across the loop"><figcaption>12 evenly spaced frames of the 2-second loop</figcaption></figure>
</main>
</body>
</html>
