# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=true
org.gradle.vfs.watch=true

android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.sync.suppressAgpWarnings=DEPRECATED_DSL,UNSUPPORTED_PROJECT_OPTION_USE

# AGP 8.7.3 is tested up to compileSdk 35, but the app targets 36 and the build
# works. Silence the per-build "we recommend a newer Android Gradle plugin" wall
# of text until AGP itself supports 36 (or the project moves off this AGP).
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2

googleServices.missing.passthrough=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
